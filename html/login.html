<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - PNP Digital</title>
  <link rel="stylesheet" href="../css/login.css">
</head>
<body>
  <header class="encabezado">
    <div class="contenedor barra-nav">
      <a href="index.html" class="marca">
        <img src="/images (1).png" alt="Logo PNP" class="logo-header">
        PNP <span>Digital</span>
      </a>
    </div>
  </header>

  <main class="contenedor">
    <div class="panel-formulario animar-entrada">
      <div class="encabezado-form">
        <img src="/images (1).png" alt="PNP Logo" class="logo-form">
        <h2>Acceso al Sistema</h2>
        <p>Ingresa con tu cuenta de ciudadano o credenciales policiales</p>
      </div>

      <form class="formulario" id="formulario-login" novalidate>
        <div class="campo">
          <label for="correo">Correo Electrónico</label>
          <input type="email" id="correo" placeholder="correo@ejemplo.com" required>
        </div>
        <div class="campo">
          <label for="contrasena">Contraseña</label>
          <input type="password" id="contrasena" placeholder="••••••••" required>
        </div>
        <button type="submit" class="boton boton-relleno">Ingresar</button>
        <div class="mensaje-estado" id="mensaje-estado"></div>
      </form>
      <p class="enlace-secundario">¿No tienes cuenta? <a href="registro-cliente.html">Regístrate aquí</a></p>
    </div>
  </main>

  <footer class="pie">
    <p>&copy; 2026 Policía Nacional del Perú</p>
  </footer>

  <script type="module" src="../js/auth/login.js"></script>
</body>
</html>
